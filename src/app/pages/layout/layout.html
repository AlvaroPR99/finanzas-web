<div class="layout">
  <button class="menu-toggle" (click)="toggleMenu()" aria-label="Abrir menú">
    <span></span><span></span><span></span>
  </button>

  @if (menuAbierto()) {
    <div class="overlay" (click)="toggleMenu()"></div>
  }

  <aside class="sidebar" [class.open]="menuAbierto()">
    <div class="brand">
      <span class="brand-icon">💰</span>
      <span class="brand-text">Finanzas</span>
    </div>

    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">📊 Dashboard</a>
      <a routerLink="/ingresos" routerLinkActive="active">⬇️ Ingresos</a>
      <a routerLink="/gastos" routerLinkActive="active">⬆️ Gastos</a>
      <a routerLink="/ahorros" routerLinkActive="active">🐷 Ahorros</a>
      <a routerLink="/inversiones" routerLinkActive="active">📈 Inversiones</a>
      <a routerLink="/recurrentes" routerLinkActive="active">🔄 Recurrentes</a>
    </nav>

    <div class="sidebar-foot">
      <div class="user">
        <div class="user-name">{{ auth.user()?.username }}</div>
        <div class="user-role">Saldo inicial: {{ auth.user()?.saldoInicial }} €</div>
      </div>
      <button class="logout" (click)="logout()">Salir</button>
      <div class="version">v1.1</div>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
